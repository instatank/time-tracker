name: Auto-sync Claude branch to main

on:
  push:
    branches: ['claude/**']

jobs:
  # This path merges straight into main with no pull request, so the PR-level
  # gate in auto-merge-claude.yml never sees it. Without this job a secret would
  # still go laptop -> public repo -> Vercel with nothing in the way, which is
  # the exact hole the other workflows exist to close.
  gate:
    name: Wait for CI + secret scan
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for required checks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const REQUIRED = ['check.sh', 'gitleaks'];
            const sha = context.sha;
            const deadline = Date.now() + 20 * 60 * 1000; // 20 minutes

            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const newest = new Map();
              for (const run of data.check_runs) {
                if (!REQUIRED.includes(run.name)) continue;
                const prev = newest.get(run.name);
                if (!prev || new Date(run.started_at) > new Date(prev.started_at)) {
                  newest.set(run.name, run);
                }
              }

              const missing = REQUIRED.filter(n => !newest.has(n));
              const pending = [...newest.values()].filter(r => r.status !== 'completed');
              const failed  = [...newest.values()].filter(
                r => r.status === 'completed' && r.conclusion !== 'success'
              );

              if (failed.length) {
                core.setFailed(
                  'Not merging to main — required checks did not pass: ' +
                  failed.map(r => `${r.name} (${r.conclusion})`).join(', ')
                );
                return;
              }

              if (!missing.length && !pending.length) {
                core.info(`All required checks green for ${sha}: ${REQUIRED.join(', ')}`);
                return;
              }

              if (Date.now() > deadline) {
                core.setFailed(
                  'Not merging to main — timed out waiting for required checks. ' +
                  `missing=[${missing.join(', ')}] pending=[${pending.map(r => r.name).join(', ')}]`
                );
                return;
              }

              core.info(
                `Waiting… missing=[${missing.join(', ')}] ` +
                `pending=[${pending.map(r => r.name).join(', ')}]`
              );
              await new Promise(r => setTimeout(r, 15000));
            }

  sync-to-main:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge claude branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BRANCH"
          git merge "origin/$BRANCH" --ff-only \
            || git merge "origin/$BRANCH" --no-ff -m "Auto-merge: $BRANCH"
          git push origin main

      - name: Rebase claude branch onto updated main
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          git fetch origin main
          git checkout "$BRANCH"
          git rebase origin/main
          git push --force-with-lease origin "$BRANCH"

  # The push to main above is made with GITHUB_TOKEN, and GitHub will not start
  # a new workflow run from such a push. So the rules deploy has to be CALLED
  # from here rather than triggered by the push it just made — otherwise it
  # would never run on this repo's normal flow. Runs after the merge, so a
  # failed deploy shows red without holding up or undoing the merge.
  deploy-rules:
    name: Deploy Firebase rules
    needs: sync-to-main
    uses: ./.github/workflows/firebase-rules-deploy.yml
    secrets: inherit
