name: Secret scan

on:
  push:
  pull_request:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.28.0'

jobs:
  gitleaks:
    # This job name is the status-check string to require in branch protection.
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a commit range can actually be walked.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans the commits introduced by this push / PR. Git keeps history, so a
      # secret that is added and then removed in the same push still counts as
      # leaked — scanning the range catches that, scanning the tree would not.
      #
      # --redact is REQUIRED: this repo is public, so Actions logs are public.
      # Without it a caught secret would be reprinted into a public log.
      - name: Scan commit range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          RANGE=""

          if [ "$EVENT" = "pull_request" ]; then
            # Everything on the PR head that is not already on the base branch.
            if git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
              RANGE="${PR_BASE_SHA}..HEAD"
            else
              git fetch --no-tags origin "$BASE_REF" || true
              RANGE="origin/${BASE_REF}..HEAD"
            fi
          else
            # Push. github.event.before is all-zeros for a brand-new branch, and
            # can point at a vanished commit after a force-push/rebase — the
            # claude/** sync workflow force-pushes, so this case is real.
            if [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..${HEAD_SHA}"
            fi
          fi

          if [ -n "$RANGE" ]; then
            echo "Scanning commit range: $RANGE"
            if [ -z "$(git rev-list "$RANGE" 2>/dev/null)" ]; then
              echo "Range is empty (no new commits) — scanning working tree instead."
              exec gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner
            fi
            exec gitleaks git . \
              --config .gitleaks.toml \
              --log-opts "$RANGE" \
              --redact --verbose --no-banner
          fi

          # No usable range (new branch, force-push, or first run):
          # fall back to scanning everything currently in the tree.
          echo "No usable commit range — scanning full working tree."
          exec gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner
